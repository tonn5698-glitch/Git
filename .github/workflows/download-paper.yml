name: Download Paper and Commit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-download
  cancel-in-progress: false

jobs:
  download-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Download Paper 26.1.2 stable build
        shell: bash
        run: |
          set -euo pipefail
          USER_AGENT="Ton-Minecraft-Paper-Downloader/1.0 (https://github.com/tonn5698-glitch/Git)"
          VERSION="26.1.2"
          BUILDS="$(curl -fsSL --retry 3 -H "User-Agent: $USER_AGENT" "https://fill.papermc.io/v3/projects/paper/versions/$VERSION/builds")"
          BUILD="$(printf '%s' "$BUILDS" | jq -ce '[.[] | select(.channel == "STABLE")][0]')"
          PAPER_URL="$(printf '%s' "$BUILD" | jq -er '.downloads."server:default".url')"
          PAPER_BUILD="$(printf '%s' "$BUILD" | jq -er '.id')"
          EXPECTED_SHA256="$(printf '%s' "$BUILD" | jq -er '.downloads."server:default".checksums.sha256')"
          mkdir -p server
          curl -fL --retry 3 --retry-delay 2 -H "User-Agent: $USER_AGENT" "$PAPER_URL" -o server/paper.jar
          ACTUAL_SHA256="$(sha256sum server/paper.jar | cut -d ' ' -f 1)"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "SHA-256 verification failed!"
            exit 1
          fi
          printf 'Paper version: %s\nPaper build: %s\nSHA-256: %s\n' "$VERSION" "$PAPER_BUILD" "$ACTUAL_SHA256" > server/paper-version.txt
          echo "Downloaded and verified Paper $VERSION build $PAPER_BUILD"

      - name: Commit and push Paper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/paper.jar server/paper-version.txt
          if git diff --cached --quiet; then
            echo "Paper files are unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Add Paper 26.1.2 server jar"
          git push origin "HEAD:${GITHUB_REF_NAME}"
