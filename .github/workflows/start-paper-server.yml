name: Start Paper World Server

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-world-live
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Paper and configured world
        shell: bash
        run: |
          set -euo pipefail
          test -s server/paper.jar
          test -s server/server.properties
          grep -q "^eula=true$" server/eula.txt
          WORLD_NAME="$(sed -n "s/^level-name=//p" server/server.properties | head -n 1)"
          test -n "$WORLD_NAME"
          echo "Starting configured world: $WORLD_NAME"
          if [ -d "server/$WORLD_NAME" ]; then
            echo "Using existing world folder: server/$WORLD_NAME"
          else
            echo "World folder is absent; Paper will generate: server/$WORLD_NAME"
          fi

      - name: Start Paper world
        shell: bash
        run: |
          set -euo pipefail
          cd server
          mkdir -p logs
          CONSOLE_PIPE="$RUNNER_TEMP/paper-console"
          LOG_FILE="$RUNNER_TEMP/paper-server.log"
          mkfifo "$CONSOLE_PIPE"
          exec 3<>"$CONSOLE_PIPE"
          java -Xms1G -Xmx4G -jar paper.jar --nogui < "$CONSOLE_PIPE" > "$LOG_FILE" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            set +e
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              printf "stop\\n" >&3
              wait "$SERVER_PID"
            fi
            exec 3>&-
            rm -f "$CONSOLE_PIPE"
          }
          trap cleanup EXIT INT TERM
          READY=0
          for i in $(seq 1 240); do
            if grep -q "Done (" "$LOG_FILE"; then READY=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat "$LOG_FILE"; exit 1; fi
            sleep 1
          done
          cat "$LOG_FILE"
          if [ "$READY" -ne 1 ]; then
            echo "Paper did not finish startup within 4 minutes."
            exit 1
          fi
          echo "Paper is running the world specified by server/server.properties."
          for i in $(seq 1 2070); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Paper stopped unexpectedly."
              exit 1
            fi
            sleep 10
          done

      - name: Save world changes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find server -path "*/session.lock" -type f -delete 2>/dev/null || true
          git add -A -- server/world
          if git diff --cached --quiet; then
            echo "No world changes to save."
            exit 0
          fi
          git commit -m "Save Paper world changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
