name: BlockLab Live World Server

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blocklab-live
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate BlockLab
        run: |
          set -e
          test -s server/paper.jar
          test -s Gamemodes/place_to_break.zip
          python3 -m py_compile web/server.py
          python3 -m unittest web/test_server.py
          unzip -t Gamemodes/place_to_break.zip
          grep -q '^eula=true$' server/eula.txt

      - name: Start BlockLab API
        env:
          BLOCKLAB_ADMIN_PASSWORD: ${{ secrets.BLOCKLAB_ADMIN_PASSWORD }}
        run: |
          set -e
          test -n "$BLOCKLAB_ADMIN_PASSWORD" || { echo 'Missing BLOCKLAB_ADMIN_PASSWORD repository secret.'; exit 1; }
          mkdir -p artifacts
          python3 -u web/server.py > >(sed '/^Admin password: /d' > "$RUNNER_TEMP/blocklab.log") 2>&1 &
          echo $! > "$RUNNER_TEMP/blocklab.pid"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/status >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/status >/dev/null
          ADMIN_CODE="$(grep '^Admin ID: ' "$RUNNER_TEMP/blocklab.log" | sed 's/^Admin ID: //' | head -1)"
          test -n "$ADMIN_CODE"
          echo "## BlockLab login" >> "$GITHUB_STEP_SUMMARY"
          echo 'Username: `TonKun`' >> "$GITHUB_STEP_SUMMARY"
          echo "Admin ID: \`$ADMIN_CODE\` (identifier only; not the login password)" >> "$GITHUB_STEP_SUMMARY"

      - name: Start Cloudflare web tunnel
        run: |
          set -e
          curl -fsSL --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" tunnel --url http://127.0.0.1:8080 --no-autoupdate > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cloudflared.pid"
          URL=""
          for i in $(seq 1 60); do
            URL="$(grep -Eo 'https://[A-Za-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | head -1 || true)"
            [ -n "$URL" ] && break
            sleep 2
          done
          test -n "$URL"
          echo "Dashboard: $URL"
          printf "%s\n" "$URL" > "$RUNNER_TEMP/blocklab-tunnel-url.txt"
          echo "## BlockLab dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "[$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish tunnel URL
        uses: actions/upload-artifact@v4
        with:
          name: blocklab-tunnel-url
          path: ${{ runner.temp }}/blocklab-tunnel-url.txt
          if-no-files-found: error
          retention-days: 1

      - name: Email dashboard link via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -e
          test -n "$RESEND_API_KEY" || { echo 'Missing RESEND_API_KEY repository secret.'; exit 1; }
          URL="$(cat "$RUNNER_TEMP/blocklab-tunnel-url.txt")"
          PAYLOAD="$(jq -n --arg url "$URL" '{from:"BlockLab <onboarding@resend.dev>",to:["tonn5698@gmail.com"],subject:"BlockLab server is online",text:("Your BlockLab dashboard is online: " + $url + "\nUsername: TonKun\nFor security, the admin password is not included in email. Use the BLOCKLAB_ADMIN_PASSWORD repository secret you configured.")}')"
          curl --fail-with-body --silent --show-error https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$PAYLOAD" > "$RUNNER_TEMP/resend-response.json"
          echo 'Resend accepted the dashboard notification.'

      - name: Keep server online
        run: |
          set -e
          cleanup() {
            set +e
            kill -TERM "$(cat "$RUNNER_TEMP/blocklab.pid")" 2>/dev/null || true
            kill "$(cat "$RUNNER_TEMP/cloudflared.pid")" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM
          echo 'Select a gamemode in the dashboard. Paper is started by the API.'
          for i in $(seq 1 2070); do sleep 10; done

      - name: Upload world artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blocklab-world-artifacts
          path: artifacts/*.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Save worlds
        if: always()
        run: |
          set -e
          rm -f server/worlds/*/session.lock 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A server/worlds artifacts worlds.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save BlockLab world and artifacts'
          git push origin HEAD:${GITHUB_REF_NAME}
