name: Start Paper Server

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-server-live
  cancel-in-progress: false

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}
          fetch-depth: 0

      - name: Validate required secrets and world
        shell: bash
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$PLAYIT_SECRET" ]; then
            echo "::error::Missing repository secret PLAYIT_SECRET. Add your Playit agent secret in Settings > Secrets and variables > Actions."
            exit 1
          fi
          test -s server/paper.jar
          test -s server/world/level.dat
          grep -q '^eula=true$' server/eula.txt
          grep -q '^level-name=world$' server/server.properties

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Geyser, Floodgate, and ViaVersion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/plugins
          curl --fail --location --retry 3 \
            https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot \
            -o server/plugins/Geyser-Spigot.jar
          curl --fail --location --retry 3 \
            https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot \
            -o server/plugins/floodgate-spigot.jar
          VIA_URL="$(curl --fail --location --retry 3 \
            'https://api.modrinth.com/v2/project/viaversion/version?loaders=%5B%22paper%22%5D&game_versions=%5B%2226.1.2%22%5D&version_type=release' \
            | python3 -c 'import json,sys; versions=json.load(sys.stdin); match=next((v for v in versions if v.get("version_type")=="release" and "26.1.2" in v.get("game_versions",[])), None); assert match, "No ViaVersion release found for Minecraft 26.1.2"; print(next(f["url"] for f in match["files"] if f.get("primary")))')"
          curl --fail --location --retry 3 "$VIA_URL" -o server/plugins/ViaVersion.jar

          # Seed Geyser's config before its first startup so Bedrock uses Floodgate authentication.
          GEYSER_CONFIG="server/plugins/Geyser-Spigot/config.yml"
          if [ ! -s "$GEYSER_CONFIG" ]; then
            mkdir -p "$(dirname "$GEYSER_CONFIG")"
            cat > "$GEYSER_CONFIG" <<'YAML'
          bedrock:
            address: 0.0.0.0
            port: 19132
            clone-remote-port: false
          remote:
            address: auto
            port: 25565
            auth-type: floodgate
          floodgate-key-file: key.pem
          YAML
          else
            # Keep custom settings but ensure Floodgate authentication is enabled.
            sed -i -E 's/^([[:space:]]*auth-type:).*/\1 floodgate/' "$GEYSER_CONFIG"
          fi
          echo "Installed plugin files:"
          ls -lh server/plugins/Geyser-Spigot.jar server/plugins/floodgate-spigot.jar server/plugins/ViaVersion.jar
          grep -n -A4 '^remote:' "$GEYSER_CONFIG"

      - name: Start Playit tunnel
        shell: bash
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -euo pipefail
          docker pull ghcr.io/playit-cloud/playit-agent:1.0
          docker run -d --name playit-agent --network host \
            -e SECRET_KEY="$PLAYIT_SECRET" \
            ghcr.io/playit-cloud/playit-agent:1.0
          docker logs --follow playit-agent &
          echo $! > "$RUNNER_TEMP/playit-log-pid"
          echo "Playit agent started. Public address may also be viewed at https://playit.gg/account/tunnels"
          sleep 10
          docker ps --filter name=playit-agent --format 'Playit container status: {{.Status}}'
          docker logs --tail 30 playit-agent

      - name: Start Paper and keep it online for 5h45m
        shell: bash
        run: |
          set -euo pipefail
          cd server
          CONSOLE_PIPE="$RUNNER_TEMP/paper-console"
          STARTUP_LOG="$RUNNER_TEMP/paper-server.log"
          mkfifo "$CONSOLE_PIPE"
          exec 3<>"$CONSOLE_PIPE"
          java -Xms1G -Xmx4G -jar paper.jar --nogui < "$CONSOLE_PIPE" > "$STARTUP_LOG" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Sending graceful stop to Paper..."
              printf 'save-all\n' >&3 || true
              sleep 2
              printf 'stop\n' >&3 || true
              for _ in $(seq 1 60); do
                kill -0 "$SERVER_PID" 2>/dev/null || break
                sleep 1
              done
              kill -0 "$SERVER_PID" 2>/dev/null && kill "$SERVER_PID" || true
              wait "$SERVER_PID" || true
            fi
            docker logs --tail 80 playit-agent 2>/dev/null || true
            docker stop playit-agent >/dev/null 2>&1 || true
            docker rm playit-agent >/dev/null 2>&1 || true
            exec 3>&- || true
            rm -f "$CONSOLE_PIPE"
          }
          trap cleanup EXIT INT TERM

          READY=0
          for _ in $(seq 1 300); do
            if grep -q 'Done (' "$STARTUP_LOG"; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$STARTUP_LOG"
              exit 1
            fi
            sleep 1
          done
          cat "$STARTUP_LOG"
          if [ "$READY" -ne 1 ]; then
            echo "::error::Paper did not finish startup within 5 minutes."
            exit 1
          fi

          echo "Paper is online. Keep this Actions run open; the world will be committed after a clean shutdown."
          echo "Server will stop automatically after 5 hours 45 minutes."
          for _ in $(seq 1 12); do
            MATCH="$(docker logs playit-agent 2>&1 | grep -Eo '[A-Za-z0-9.-]+\.playit\.gg(:[0-9]+)?' | tail -1 || true)"
            if [ -n "$MATCH" ]; then
              echo "Possible Playit address: $MATCH"
              break
            fi
            sleep 5
          done

          sleep 345m
          echo "Runtime reached 5h45m; saving and stopping Paper."
          printf 'save-all\n' >&3
          sleep 3
          printf 'stop\n' >&3
          wait "$SERVER_PID"
          exec 3>&-
          rm -f "$CONSOLE_PIPE"
          trap - EXIT INT TERM
          docker logs --tail 80 playit-agent || true
          docker stop playit-agent >/dev/null
          docker rm playit-agent >/dev/null

      - name: Commit world after Paper has stopped
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if pgrep -af '[j]ava .* -jar paper\.jar' >/dev/null; then
            echo "::error::Paper process still appears to be running; refusing to commit world files."
            exit 1
          fi
          rm -f server/world/session.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A server/world server/server.properties server/eula.txt server/config server/plugins
          if git diff --cached --quiet; then
            echo "No world or server data changes to commit."
            exit 0
          fi
          git commit -m "Save Paper server world after shutdown"
          git push origin "HEAD:${GITHUB_REF_NAME}"
